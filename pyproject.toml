[project]
name = "stormwater-advisor"
version = "0.1.0"
description = "Stormwater ESU fee and pervious pavement cost comparison"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "httpx"]
ai  = ["anthropic>=0.40"]   # Milestone 8 only. Not needed for the MVP.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
